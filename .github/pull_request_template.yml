name: Pull Request
description: Submit changes to ARSLANIUS
title: '[PR] '
labels: []
assignees:
  - Armsoup
body:
  - type: markdown
    attributes:
      value: |
        ### ARSLANIUS pull request
        Read CONTRIBUTING.md first. Vague PRs will be closed

  - type: textarea
    id: what-changed
    attributes:
      label: What changed
      description: A clear and concise description of what you changed
      placeholder: |
        Fixed login screen not showing users created via OOBE.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why
      description: Why is this change needed? What problem does it solve?
      placeholder: |
        Users created during OOBE didn't appear on the login screen because...
    validations:
      required: true

  - type: textarea
    id: how-tested
    attributes:
      label: How to test
      description: Steps to verify your change works. Be specific
      placeholder: |
        1. Build ARSLANIUS.
        2. Run OOBE, create a user.
        3. Reboot. The user should appear on the login screen.
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: You must check all of these. If you can't, don't open the PR
      options:
        - label: I compiled the code and it builds without errors
          required: true
        - label: I tested the change and it works as described
          required: true
        - label: My code follows the style in CONTRIBUTING.md (tabs, etc)
          required: true
        - label: If I made changes to `clearScreen()`, I’m sure the function works correctly, or even better, both in conhost and in Windows Terminal
          required: true
        - label: I agree my code will be licensed under AGPL-3.0
          required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else worth mentioning. Screenshots, logs, links
      placeholder: |
        Attached a screenshot of the login screen before and after the fix.
    validations:
      required: false
